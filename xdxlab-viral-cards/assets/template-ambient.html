<!DOCTYPE html>
<html lang="zh-CN" data-style="ambient">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>柔和氛围风 模板</title>
  <link rel="stylesheet" href="base.css">
  <style>
    /* ===== ambient token（来自 style-presets.md）===== */
    [data-style="ambient"] {
      --bg: #F3EBDF;
      --ink: #5B5048;
      --ink-soft: #9A8E80;
      --accent: #C98C7A;
      --accent-soft: #E8D5CC;

      --font-display: "PingFang SC", "Microsoft YaHei", sans-serif;
      --font-body: "PingFang SC", "Microsoft YaHei", sans-serif;
      --pad: 100px;

      --fs-cover-title: 76px;
      --fs-h1: 48px;
      --fs-body: 30px;
      --fs-caption: 23px;
      --radius: 32px;
      --hairline: 1px;
      --line-color: #D8CABA;
    }

    /* ===== ambient 版式 ===== */
    .poster {
      background:
        radial-gradient(55% 40% at 82% 10%, rgba(255, 246, 235, 0.85), transparent 70%),
        radial-gradient(50% 38% at 12% 96%, rgba(201, 140, 122, 0.14), transparent 72%),
        var(--bg);
      color: var(--ink);
      padding: var(--pad);
      font-family: var(--font-body);
    }

    /* 柔和暖光的极淡光晕，强化"晨光"氛围 */
    .am-glow {
      position: absolute;
      width: 720px; height: 720px;
      border-radius: 50%;
      background: radial-gradient(circle, var(--accent-soft) 0%, transparent 68%);
      opacity: .6;
      top: -180px; right: -200px;
      pointer-events: none;
    }

    /* —— 封面 —— */
    .am-kicker {
      font-size: var(--fs-caption);
      letter-spacing: 10px;
      color: var(--ink-soft);
      margin-top: 60px;
    }
    .am-cover-title {
      font-family: var(--font-display);
      font-weight: 300;
      font-size: var(--fs-cover-title);
      line-height: 1.55;
      letter-spacing: 4px;
      margin-top: 80px;
    }
    .am-cover-title b {
      font-weight: 500;
      color: var(--accent);
    }
    .am-card {
      margin-top: 80px;
      background: var(--accent-soft);
      border-radius: var(--radius);
      padding: 56px 60px;
      max-width: 86%;
    }
    .am-card p {
      font-size: 34px;
      font-weight: 300;
      line-height: 1.85;
      letter-spacing: 2px;
      color: var(--ink);
    }

    /* —— 内容页：图文轻盈混排 —— */
    .am-h1 {
      font-family: var(--font-display);
      font-weight: 400;
      font-size: var(--fs-h1);
      line-height: 1.5;
      letter-spacing: 3px;
      margin-top: 60px;
    }
    .am-imgwrap {
      margin-top: 56px;
      width: 100%;
      height: 440px;
      border-radius: var(--radius);
      background:
        radial-gradient(circle at 30% 30%, var(--accent-soft), #EFE2D2 70%);
      position: relative;
      overflow: hidden;
    }
    .am-imgwrap .leaf {
      position: absolute;
      right: 80px; bottom: -40px;
      width: 260px; height: 260px;
      border-radius: 50%;
      background: var(--accent);
      opacity: .28;
    }
    .am-imgwrap .dot {
      position: absolute;
      left: 90px; top: 80px;
      width: 90px; height: 90px;
      border-radius: 50%;
      background: #fff;
      opacity: .5;
    }
    .am-rows {
      margin-top: 64px;
      display: flex;
      flex-direction: column;
      gap: 44px;
    }
    .am-row {
      display: flex;
      align-items: flex-start;
      gap: 30px;
    }
    .am-row .mk {
      flex: none;
      width: 18px; height: 18px;
      border-radius: 50%;
      background: var(--accent);
      margin-top: 14px;
    }
    .am-row .tx {
      font-size: var(--fs-body);
      font-weight: 300;
      line-height: 1.8;
      letter-spacing: 1px;
    }
    .am-row .tx b { font-weight: 500; color: var(--ink); }

    /* —— 底栏 —— */
    .am-foot {
      display: flex;
      align-items: center;
      gap: 16px;
      padding-top: 50px;
      border-top: var(--hairline) solid var(--line-color);
      font-size: var(--fs-caption);
      letter-spacing: 3px;
      color: var(--ink-soft);
    }
    .am-foot .ring {
      width: 26px; height: 26px;
      border-radius: 50%;
      border: 2px solid var(--accent);
    }
  </style>
</head>
<body>
  <div class="stage">

    <!-- ===== 封面页 ===== -->
    <section class="poster">
      <div class="am-glow"></div>

      <div class="am-kicker">SLOW LIVING · 晨间手记</div>

      <h1 class="am-cover-title">
        把日子过<b>慢</b>一点，<br>
        清晨先<b>留给自己</b><br>
        二十分钟
      </h1>

      <div class="am-card">
        <p>不开手机，只煮一杯咖啡，看光从窗帘缝里一点点漫进来——这是我对抗忙碌的小小仪式。</p>
      </div>

      <div class="foot am-foot">
        <span class="ring"></span>
        <span>@温柔生活研究所</span>
      </div>
    </section>

    <!-- POSTERS_HERE: 复制 .poster 区块来增加页数 -->

    <!-- ===== 内容页 ===== -->
    <section class="poster">
      <div class="am-glow"></div>

      <h2 class="am-h1">三个让清晨<br>慢下来的小习惯</h2>

      <div class="am-imgwrap">
        <span class="dot"></span>
        <span class="leaf"></span>
      </div>

      <div class="am-rows">
        <div class="am-row">
          <span class="mk"></span>
          <p class="tx"><b>醒来先不碰手机</b>　给大脑一段不被信息打扰的空白，哪怕只是发呆，也是在为一天蓄一点力。</p>
        </div>
        <div class="am-row">
          <span class="mk"></span>
          <p class="tx"><b>认真冲一杯热饮</b>　水温、香气、等待的几分钟，把注意力放回当下，焦虑会悄悄退潮。</p>
        </div>
        <div class="am-row">
          <span class="mk"></span>
          <p class="tx"><b>写三行小日记</b>　记下昨天最暖的一个瞬间，温柔会被你一点点攒起来。</p>
        </div>
      </div>

      <div class="foot am-foot">
        <span class="ring"></span>
        <span>@温柔生活研究所</span>
      </div>
    </section>

  </div>
</body>
</html>
